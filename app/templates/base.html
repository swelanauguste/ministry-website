{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f41">
  <meta name="description" content="Explore infrastructure, port services and energy in Saint Lucia. Find public services, projects, notices and ministry resources.">
  <title>{% block head_title %}Ministry of Infrastructure, Port Services and Energy{% endblock %} | Saint Lucia</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <script src="{% static 'vendor/htmx-2.0.11.min.js' %}" defer></script>
  <script src="{% static 'js/site.js' %}" defer></script>
  <script src="{% static 'vendor/alpine-3.14.9.min.js' %}" defer></script>
  <noscript><style>
    .primary-nav, .search-panel[x-cloak]{display:block!important}
    .search-toggle, .menu-toggle{display:none!important}
  </style></noscript>
</head>
<body id="top" x-data="ministrySite" x-init="searchOpen = {{ search_submitted|yesno:'true,false' }}"
      @keydown.escape.window="closePanels()"
      @htmx:response-error.camel.window="requestError = true"
      @htmx:send-error.camel.window="requestError = true"
      @htmx:before-request.camel.window="requestError = false">
  <a class="skip-link" href="#main">Skip to main content</a>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="road" viewBox="0 0 24 24"><path d="M7 3 3 21M17 3l4 18M12 3v4m0 3v4m0 3v4"/></symbol>
    <symbol id="anchor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v13M7 11h10M3 14v3c0 5 18 5 18 0v-3M3 14l-2 3m20-3 2 3"/></symbol>
    <symbol id="file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8l-5-5v5h5M8 12h8m-8 4h8"/></symbol>
    <symbol id="message" viewBox="0 0 24 24"><path d="M21 15a3 3 0 0 1-3 3H9l-6 4V5a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3ZM7 7h10M7 12h7"/></symbol>
  </defs></svg>
  {% include 'nav-bar.html' %}
  <main id="main">{% block content %}{% endblock %}</main>
  <p class="request-error" role="alert" x-cloak x-show="requestError">We couldn’t load that content. Please try again.
    <button type="button" @click="requestError = false" aria-label="Dismiss error">×</button>
  </p>
  {% include 'footer.html' %}
</body>
</html>
